<!doctype html>
<html lang="tr" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HELUNEXA - Check-up Akıllı Değerlendirme</title>
    <link rel="icon" href="favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --ink: #213e39; --muted: #76877e; --teal: #10b981; --teal-dark: #059669;
            --line: #e2e9e3; --bg: #f6f8f4
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--ink); background: var(--bg); }
        
        .header { background: white; padding: 15px; text-align: center; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
        .header img { height: 80px; width: auto; }

        main { max-width: 700px; padding: 0 20px 40px; margin: auto; }
        
        .card { border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 30px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .card-heading { margin-bottom: 25px; text-align: center; }
        .card-heading h2 { font-size: 24px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
        .card-heading p { font-size: 13px; color: var(--muted); }

        nav { display: flex; margin-bottom: 25px; gap: 10px; justify-content: center; }
        .step { flex: 1; border-bottom: 2px solid var(--line); padding-bottom: 12px; display: flex; align-items: center; gap: 8px; color: #829087; font-size: 11px; font-weight: bold; }
        .step span { width: 24px; height: 24px; border: 1px solid #dce5dd; border-radius: 50%; display: grid; place-items: center; font-size: 10px; }
        .step.current { border-color: var(--teal); color: var(--teal); }
        .step.current span, .step.done span { background: #e7f2ea; color: var(--teal); border-color: #d7e9dc; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-size: 13px; margin-bottom: 15px; color: #486359; font-weight: bold; }
        input, select, textarea { width: 100%; font: inherit; padding: 12px; margin-top: 6px; border: 1px solid #d9e3da; border-radius: 8px; color: var(--ink); outline: none; }
        input:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(16,185,129,0.1); }

        .panel { padding: 20px 0; border-bottom: 1px solid var(--line); }
        .panel:last-of-type { border: 0; }
        .panel-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .panel-title h3 { font-size: 15px; color: var(--ink); }
        .panel-tag { font-size: 10px; background: #eaf3ed; color: var(--teal); border-radius: 5px; padding: 4px 8px; font-weight: bold; }
        .test-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .test-list span { border: 1px solid var(--line); background: #f7f9f6; border-radius: 6px; padding: 6px 10px; font-size: 12px; color: #486151; }
        
        .btn { padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; }
        .btn-primary { background: var(--teal); color: white; }
        .btn-primary:hover { background: var(--teal-dark); }
        .btn-secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
        .actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 30px; }

        .application { background: #f5f8f4; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .application p { font-size: 13px; color: #4d6758; margin: 5px 0; }

        .subnote { padding: 15px; background: #f2f7f2; border-radius: 8px; color: #65816d; font-size: 12px; margin-top: 20px; border-left: 4px solid var(--teal); }
        .check { display: flex; align-items: center; gap: 10px; font-size: 12px; margin: 15px 0; }
        .check input { width: auto; margin: 0; accent-color: var(--teal); }
        
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #254a3a; color: #fff; border-radius: 8px; padding: 12px 20px; font-size: 13px; z-index: 5; display: none; }
        [hidden] { display: none !important; }
        
        @media(max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .step { flex-direction: column; align-items: flex-start; gap: 4px; font-size: 10px; }
            .card { padding: 20px; }
            .actions { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body class="notranslate">

    <div class="header">
        <img src="logo.png" alt="HELUNEXA">
    </div>

    <main>
        <div class="card">
            <nav id="steps">
                <div class="step current"><span>1</span>Başvuru</div>
                <div class="step"><span>2</span>Ön Plan</div>
                <div class="step"><span>3</span>Hekim Onayı</div>
                <div class="step"><span>4</span>Sonuç & Takip</div>
            </nav>

            <div id="screen"></div>
        </div>
    </main>

    <div id="toast"></div>

    <script>
        const SUPABASE_URL = 'https://grbjmhknmlheoyknmyhd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lA5YB8KySIyhrLseQV56Kw_cWLCWq7p';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, storageKey: 'helunexa-hasta-auth' }
        });

        let currentUser = null;
        let step = 0;
        let state = { profile: {}, plan: [], decisionNote: '', approved: false };

        function toast(text) {
            const el = document.getElementById('toast');
            el.textContent = text;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        // CDSS Kural Motoru (Hocanın mantığı)
        function buildPlan(p) {
            const panels = [];
            const bmi = p.weight / ((p.height / 100) ** 2);

            panels.push({ title: 'Kan Sayımı', tests: ['Hemogram'], reason: 'Kan hücrelerinin genel değerlendirmesi.' });
            panels.push({ title: 'Metabolik Değerlendirme', tests: ['Açlık plazma glukozu', 'Lipid profili'], reason: 'Metabolik sendrom ve kardiyovasküler risk taraması.' });
            panels.push({ title: 'Organ Fonksiyonları', tests: ['Kreatinin / eGFR', 'ALT', 'AST'], reason: 'Böbrek ve karaciğer fonksiyon değerlendirmesi.' });

            if (bmi >= 25) panels.push({ title: 'İnsülin Direnci Taraması', tests: ['HOMA-IR'], reason: 'VKİ yüksekliği nedeniyle metabolik risk artışı.' });
            if (bmi >= 30) panels.push({ title: 'Diyabet Taraması', tests: ['HbA1c'], reason: 'Obezite sınırında VKİ nedeniyle diyabet riski.' });
            if (p.age >= 40) panels.push({ title: 'Kalp Sağlığı', tests: ['EKG'], reason: 'Yaş faktörü nedeniyle kardiyak değerlendirme.' });

            return panels;
        }

        async function checkSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                render();
            } else {
                window.location.href = 'giris.html';
            }
        }

        function render() {
            const screens = [intake, plan, doctor, follow];
            screens[step]();
            
            const steps = document.querySelectorAll('.step');
            steps.forEach((s, i) => {
                s.className = 'step';
                if (i < step) s.classList.add('done');
                if (i === step) s.classList.add('current');
            });
        }

        // ADIM 1: Başvuru
        function intake() {
            const p = state.profile;
            document.getElementById('screen').innerHTML = `
                <div class="card-heading">
                    <h2>Kısaca sizi tanıyalım.</h2>
                    <p>Check-up planınızı oluşturmak için temel bilgilerinize ihtiyacımız var.</p>
                </div>
                <div class="form-grid">
                    <div><label>Yaş *<input type="number" id="age" value="${p.age || ''}" min="18" max="120"></label></div>
                    <div><label>Cinsiyet *<select id="sex"><option value="">Seçiniz</option><option value="Kadın" ${p.sex === 'Kadın' ? 'selected' : ''}>Kadın</option><option value="Erkek" ${p.sex === 'Erkek' ? 'selected' : ''}>Erkek</option></select></label></div>
                    <div><label>Kilo (kg) *<input type="number" id="weight" value="${p.weight || ''}" min="20" max="300"></label></div>
                    <div><label>Boy (cm) *<input type="number" id="height" value="${p.height || ''}" min="100" max="250"></label></div>
                </div>
                <div class="actions">
                    <button class="btn btn-secondary" onclick="window.location.href='basvuru.html'">Geri</button>
                    <button class="btn btn-primary" id="nextBtn">Kontrol Panelini Gör →</button>
                </div>
            `;

            document.getElementById('nextBtn').onclick = () => {
                const age = Number(document.getElementById('age').value);
                const weight = Number(document.getElementById('weight').value);
                const height = Number(document.getElementById('height').value);
                const sex = document.getElementById('sex').value;

                if (!age || !weight || !height || !sex) return toast('Lütfen tüm alanları doldurun.');

                state.profile = { age, weight, height, sex, bmi: (weight / ((height / 100) ** 2)).toFixed(1) };
                state.plan = buildPlan(state.profile);
                step = 1;
                render();
            };
        }

        // ADIM 2: Ön Plan (CDSS)
        function plan() {
            const p = state.profile;
            document.getElementById('screen').innerHTML = `
                <div class="card-heading">
                    <h2>Örnek rutin check-up planınız</h2>
                    <p>Hekiminizin inceleyip değiştirebileceği başlangıç taslağı.</p>
                </div>
                <div class="application">
                    <p><b>${p.age} yaş</b> · ${p.sex}</p>
                    <p>${p.weight} kg · ${p.height} cm · VKİ: <b>${p.bmi}</b></p>
                </div>
                ${state.plan.map(x => `
                    <div class="panel">
                        <div class="panel-title"><h3>${x.title}</h3><span class="panel-tag">Öneri</span></div>
                        <div class="test-list">${x.tests.map(t => `<span>${t}</span>`).join('')}</div>
                        <p style="font-size:11px; color:var(--muted); margin-top:5px;">${x.reason}</p>
                    </div>
                `).join('')}
                <div class="subnote">
                    ℹ️ Bu liste, girdiğiniz verilere göre sistem tarafından oluşturulmuştur. Kesin tanı veya reçete değildir. Son kararı hekiminiz verir.
                </div>
                <div class="actions">
                    <button class="btn btn-secondary" onclick="step=0; render();">Yanıtları Düzenle</button>
                    <button class="btn btn-primary" id="nextBtn">Hekim Onayına Gönder →</button>
                </div>
            `;

            document.getElementById('nextBtn').onclick = () => {
                step = 2;
                render();
            };
        }

        // ADIM 3: Hekim Onayı Simülasyonu
        function doctor() {
            document.getElementById('screen').innerHTML = `
                <div class="card-heading">
                    <h2>Hekim Onayı Bekleniyor</h2>
                    <p>Planınız incelenmek üzere hekiminize iletilmiştir.</p>
                </div>
                <div class="application">
                    <p>Hekim değerlendirmesi tamamlandığında testlerinizi yaptırabileceksiniz. Aşağıdaki butona basarak test sonuçlarının girileceği ekrana geçebilirsiniz (Demo).</p>
                </div>
                <div class="actions">
                    <button class="btn btn-secondary" onclick="step=1; render();">Geri</button>
                    <button class="btn btn-primary" id="nextBtn">Sonuç Ekranına Geç →</button>
                </div>
            `;

            document.getElementById('nextBtn').onclick = () => {
                step = 3;
                render();
            };
        }

        // ADIM 4: Sonuç ve Takip (Hocanın Son Fotoğrafındaki Ekran)
        function follow() {
            document.getElementById('screen').innerHTML = `
                <div class="card-heading">
                    <h2>Planın devamını takip edin.</h2>
                    <p>Onaylanan plan, sonuç değerlendirmesine kadar açık kalır.</p>
                </div>
                <div class="application">
                    <span style="color:var(--teal); font-size:12px; font-weight:bold;">✓ Hekim onayı kaydedildi</span>
                    <p style="margin-top:10px;">Hastanın planı onaylandı. Testlerin sonuçları aşağıdan girilerek takip kapatılabilir.</p>
                </div>
                <form id="followForm">
                    <div class="form-grid">
                        <div><label>Takip sorumlusu<input type="text" value="Dr. Ali Gül"></label></div>
                        <div><label>Sonraki işlem tarihi<input type="date"></label></div>
                    </div>
                    <label>Sonuç durumu
                        <select>
                            <option value="waiting">Sonuç bekleniyor</option>
                            <option value="normal">Hekim değerlendirdi · normal</option>
                            <option value="abnormal">Hekim değerlendirdi · takip gerekiyor</option>
                        </select>
                    </label>
                    <label>Sonraki adım<textarea rows="2" placeholder="Sonuçlara göre planlanan sonraki adım..."></textarea></label>
                    
                    <label class="check"><input type="checkbox"> Hekim değerlendirdi ve kullanıcı bilgilendirildi.</label>
                    <label class="check"><input type="checkbox"> Gerekli sonraki işlem tamamlandı.</label>

                    <div class="actions">
                        <button type="button" class="btn btn-secondary">Takibi Kaydet</button>
                        <button type="button" class="btn btn-primary" id="finishBtn">Takibi Tamamla ve Ödemeye Geç</button>
                    </div>
                </form>
            `;

            document.getElementById('finishBtn').onclick = () => {
                const not = `Check-up Planı: ${state.plan.map(p=>p.tests.join(', ')).join(' | ')} | VKİ: ${state.profile.bmi}`;
                sessionStorage.setItem('cdss_plan', not);
                window.location.href = 'basvuru.html?checkup=approved';
            };
        }

        checkSession();
    </script>
</body>
</html>
